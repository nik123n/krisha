<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Make a Wish - Krisha</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body data-page="cake">
<main><h1 class="title">Make a Wish, Krisha...</h1><p class="sub hint">Click the candles.</p>
<div class="cake-wrap">
<span class="fl" style="left:-1.5em;bottom:.5em">🌸</span><span class="fl" style="right:-1.5em;bottom:.5em;animation-delay:-1s">🌷</span><span class="fl" style="left:1em;bottom:-.8em;animation-delay:-2s">🌼</span><span class="fl" style="right:1em;bottom:-.8em;animation-delay:-3s">🌺</span>
<div class="cake"><div class="layer l3"><div class="candles">
<button class="candle" aria-label="Candle"><i class="flame"></i></button><button class="candle" aria-label="Candle"><i class="flame"></i></button><button class="candle" aria-label="Candle"><i class="flame"></i></button></div></div>
<div class="layer l2"></div><div class="layer l1"></div><div class="plate"></div></div></div>
<div class="msg"><h2>Happy Birthday, Krisha!</h2><p class="hand" style="font-size:2rem">May every wish you make today find its way to you.</p></div></main>
<script src="js/script.js"></script>
</body></html>
